name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Validates the wrapper jar and caches Gradle's downloads between runs.
      - uses: gradle/actions/setup-gradle@v6

      # The runner ships with the SDK, but may not include this exact compileSdk.
      - name: Install Android SDK platform
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36.1"

      # Pull requests run code that hasn't been merged, so they never get the signing key.
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: countdown-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease

      # An unsigned build is named app-release-unsigned.apk, so this also fails if signing didn't happen.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: countdown-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
